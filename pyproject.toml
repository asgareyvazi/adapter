[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobitex-adapter"
version = "0.1.0"
description = "Nobitex public market-data adapter + backtest manager for Freqtrade (NFI X8)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
# NOTE on dependencies:
#  * `freqtrade` is declared so a FRESH environment can run the adapter, but
#    the BACKTEST runtime is taken from the selected Freqtrade repo's .venv
#    (see nobitex_adapter/runtime.py). Installing the adapter INTO that venv
#    is optional (it works via PYTHONPATH too).
#  * `python-rapidjson` is Freqtrade's JSON dep (the bare `rapidjson` name on
#    PyPI is the wrong/legacy package).
dependencies = [
    "freqtrade>=2024.10",
    "TA-Lib>=0.5",
    "python-rapidjson",
    "pyarrow>=14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",  # FastAPI TestClient transport used by the GUI tests
]

[project.scripts]
nobitex-markets = "nobitex_adapter.cli:markets_main"
nobitex-download = "nobitex_adapter.cli:download_main"
nobitex-validate = "nobitex_adapter.cli:validate_main"
nobitex-backtest = "nobitex_adapter.cli:backtest_main"
nobitex-ui = "nobitex_adapter.cli:ui_main"
nobitex-mock = "nobitex_adapter.cli:mock_main"
nobitex-probe = "nobitex_adapter.cli:probe_main"
nobitex-depth = "nobitex_adapter.cli:depth_main"
nobitex-doctor = "nobitex_adapter.cli:doctor_main"
nobitex-compare = "nobitex_adapter.cli:compare_main"

[tool.setuptools.packages.find]
include = ["nobitex_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# hermetic by default: the `live` tests (real Nobitex API, external network)
# are opt-in via `pytest -m live`
addopts = "-m 'not live'"
markers = [
    "unit: fast hermetic tests (scripted HTTP only, no servers, no freqtrade)",
    "integration: tests that run real HTTP against the in-repo mock exchange APIs (no external network)",
    "e2e: full-pipeline tests incl. real Freqtrade backtests (slow)",
    "live: tests that hit a real exchange public API (network required, run with -m live)",
]
